services:
  postgres:
    image: postgres:15
    container_name: aurelia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurelia
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurelia_dev}
    ports:
      - "5437:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
